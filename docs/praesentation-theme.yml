extends: default

page:
  layout: landscape
  size: A4
  margin: [0.46in, 0.5in, 0.42in, 0.5in]
  background-color: #fbf8f1

base:
  font-family: Helvetica
  font-size: 18
  font-color: #23201d
  line-height: 1.42
  text-align: center

section:
  indent: 0

heading:
  font-family: Helvetica
  font-style: bold
  font-color: #23201d
  text-align: center
  h1-font-size: 44
  h1-margin-top: 0
  h1-margin-bottom: 12
  h2-font-size: 37
  h2-margin-top: 0
  h2-margin-bottom: 12
  h3-font-size: 27
  h3-margin-top: 0
  h3-margin-bottom: 8
  h4-font-size: 20
  h4-margin-top: 0
  h4-margin-bottom: 6

prose:
  margin-bottom: 10

list:
  text-align: center
  item-spacing: 6
  marker-font-color: #7b8790
  indent: 0

quote:
  background-color: #fcfbf7
  border-color: #e4ddd1
  border-width: 1
  padding: [16, 20]
  text-align: center

code:
  font-family: Courier
  font-size: 13.5
  background-color: #f2ede6
  border-color: #ddd4c6
  border-width: 1
  padding: 16
  text-align: left

table:
  border-color: #e3dbcf
  border-width: 0.75
  text-align: center
  grid-width: 2
  border-color: #d8d1c6
  border-style: dashed

sidebar:
  background-color: #fffdf8
  border-color: #d8d1c6
  border-width: 2
  border-style: dashed
  border-radius: 18
  padding: [16, 18]
  text-align: center

footer:
  border-width: 0
  font-size: 16

role:
  lead:
    font-size: 25
    font-color: #23201d
    text-align: center
  accent:
    font-color: #506371
    font-style: bold
